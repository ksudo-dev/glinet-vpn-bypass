name: Update subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python generate.py
      - run: python generate.py --check
      - name: Commit a changed subscription
        run: |
          if git diff --quiet -- flint3-vpn-bypass.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flint3-vpn-bypass.txt
          git commit -m "Update VPN bypass subscription"
          git push
